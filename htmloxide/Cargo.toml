[package]
name = "htmloxide"
description = "Write HTML in Rust that looks like HTML: components, async components, htmx-friendly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
htmloxide-macros = { version = "=0.1.0", path = "../htmloxide-macros" }
maud = "0.27.0"

[dev-dependencies]
maud = "0.27"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
